name: iOS

on:
  push:
    paths:
      - 'studytimer/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'studytimer/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: studytimer

jobs:
  build:
    name: Build (iOS 26 SDK)
    # Pinned deliberately. `macos-latest` still resolves to Xcode 16.4
    # (actions/runner-images#14165), which has no iOS 26 SDK — so no .glassEffect(),
    # no Tab syntax, no build.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          # Highest installed Xcode 26.x rather than a hardcoded point release: the
          # runner image's default moves every couple of months.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "SDKs:"
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build all six targets
        # `generic/platform=iOS` needs no simulator runtime — those are frequently
        # missing on this image (actions/runner-images#13435) and a device-arch build
        # is a stricter compile check anyway. Signing off means the Family Controls
        # entitlement isn't validated, so no provisioning profile is required.
        run: |
          set -o pipefail
          xcodebuild build \
            -project StudyTimer.xcodeproj \
            -scheme StudyTimer \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/raw.log" | xcbeautify --renderer github-actions || {
              # xcbeautify drops `note:` lines, which are the half of a protocol
              # conformance error that says *which* requirement is unsatisfied.
              # Developing without a local compiler makes that the difference
              # between one push and four.
              echo "::group::Raw xcodebuild diagnostics"
              grep -E "error:|note:" "$RUNNER_TEMP/raw.log" | head -80 || true
              echo "::endgroup::"
              echo "::error::Build failed"
              exit 1
            }

  unsigned-ipa:
    name: Unsigned .ipa (sign with SideStore)
    needs: build
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::No Xcode 26.x"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned device binary
        # `xcodebuild archive` insists on signing, so this builds against the
        # iphoneos SDK with signing fully disabled and the .app is packaged by hand
        # below. That's exactly what a re-signing installer wants: no existing
        # signature to strip.
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project StudyTimer.xcodeproj \
            -scheme StudyTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcbeautify --renderer github-actions

      - name: Verify all five extensions were embedded
        # The failure this catches: an .app that installs and launches but has no
        # Live Activity and no shield, because the extensions never made it into
        # PlugIns/. Silent, and confusing to diagnose on device.
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/StudyTimer.app"
          [ -d "$APP" ] || { echo "::error::No StudyTimer.app at $APP"; ls -R "$RUNNER_TEMP/dd/Build/Products" || true; exit 1; }
          echo "Embedded extensions:"
          ls -1 "$APP/PlugIns" 2>/dev/null || echo "  (none)"
          COUNT=$(ls -1d "$APP/PlugIns"/*.appex 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $COUNT of 5 expected."
          if [ "$COUNT" -ne 5 ]; then
            echo "::warning::Expected 5 .appex bundles (widgets, monitor, shieldconfig, shieldaction, report), found $COUNT."
          fi

      - name: Package .ipa
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pkg"
          mkdir -p "$WORK/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/StudyTimer.app" "$WORK/Payload/"
          # An .ipa is just a zip with the .app under Payload/.
          (cd "$WORK" && zip -qry "$RUNNER_TEMP/LockIn-unsigned.ipa" Payload)
          ls -lh "$RUNNER_TEMP/LockIn-unsigned.ipa"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LockIn-unsigned-ipa
          path: ${{ runner.temp }}/LockIn-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::No Xcode 26.x"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Run tests
        # Tests need a simulator whose runtime is at least the deployment target
        # (iOS 26), and those runtimes come and go on this image
        # (actions/runner-images#13435, #14000). Discover one rather than
        # hardcoding a device name, and skip with a clear message instead of
        # failing opaquely when the image has nothing suitable.
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          best = ""
          for runtime, devices in data.items():
              match = re.search(r"iOS-(\d+)", runtime)
              if not match or int(match.group(1)) < 26:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      best = device["name"]
          print(best)
          ')
          if [ -z "$DEVICE" ]; then
            echo "::warning::No iOS 26+ iPhone simulator on this runner; skipping tests. Installed runtimes:"
            xcrun simctl list runtimes
            exit 0
          fi
          echo "Testing on: $DEVICE"
          set -o pipefail
          xcodebuild test \
            -project StudyTimer.xcodeproj \
            -scheme StudyTimer \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
