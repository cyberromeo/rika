name: Rika
options:
  bundleIdPrefix: quest.srihari
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  # ── App ───────────────────────────────────────────────────────────────────
  Rika:
    type: application
    platform: iOS
    sources:
      - path: Rika
      - path: Shared
    dependencies:
      - target: RikaWidgets
    settings:
      base:
        PRODUCT_NAME: Rika
        PRODUCT_BUNDLE_IDENTIFIER: quest.srihari.rika
        INFOPLIST_FILE: Rika/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rika/Resources/Rika.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

  # ── Widgets + Live Activity ───────────────────────────────────────────────
  RikaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RikaWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RikaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: quest.srihari.rika.widgets
        INFOPLIST_FILE: RikaWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: RikaWidgets/RikaWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

  # ── Tests ─────────────────────────────────────────────────────────────────
  # Hostless logic-test bundle: it compiles Shared/ itself rather than linking
  # the app, so `xcodebuild test` needs no running host application.
  RikaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RikaTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: quest.srihari.rika.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rika:
    build:
      targets:
        Rika: all
        RikaWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - RikaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
